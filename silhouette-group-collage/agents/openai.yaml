interface:
  display_name: "剪影群像风格 Skill"
  short_description: "以 Human Cutout Engine 锁定人物原像素的正负形纸艺双联画"
  default_prompt: "Use $silhouette-group-collage to process my uploaded group photo. Invoke $human-cutout-engine first, validate its source-resolution Alpha, protected RGBA, RGB lock, Alpha lock, and person count, retain necessary foreground occluders, then use that exact accepted Alpha for both reciprocal mask states. Preserve all visible people as original source pixels. Diagnose the scene and use the bundled Heirloom colour system to compare Echo, Counterpoint, and Atmosphere candidates before choosing a paper/ink/accent set with readable contrast. Build every paper field and opaque silhouette with the deterministic neutral-fibre texture layer, and render the exact seam phrase separately with one bundled T1-T5 family; never use image-generated final text. When no output size is requested, preserve the source pixel width and derive the diptych height; use 9:16 only when explicitly requested as a phone or mobile wallpaper."
