interface:
  display_name: "剪影群像风格 Skill"
  short_description: "将群像照片制作成锁定原像素、审美导向的正负形纸艺双联画"
  default_prompt: "Use $silhouette-group-collage to art-direct my uploaded group photo as a native 9:16 reciprocal silhouette diptych. Select a gold-standard recipe and adaptive layout, keep each mask coupled to the full-photo transform, refine tight edges with segmentation and matting while using depth only as support, require at least 99.5% coverage with limited excess area, preserve visible people as original source pixels, and retain scene-derived colour, varied handwriting, paper texture, and film texture."
